<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle-feat</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e24;
            --accent: #ff3b30;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--bg-secondary);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 15px;
        }
        p {
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Muscle-feat</h1>
        <p>Ton application de musculation est prête !</p>
    </div>
</body>
</html>
